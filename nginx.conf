# Docker DNS keeps the proxy working if the backend gets a new container IP.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream expenses_api {
    zone expenses_api 64k;
    server backend:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Strip /api/ before forwarding: /api/health/db -> /health/db.
    location /api/ {
        proxy_pass http://expenses_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React routes must also work when opened directly or refreshed.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
